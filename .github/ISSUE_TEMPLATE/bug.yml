name: Something is broken
description: A listed extension, an example or the catalog check doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Leave out anything private, such as your hostnames, addresses or tokens.
        A security problem goes in a private report instead (SECURITY.md).
  - type: input
    id: extension
    attributes:
      label: Which extension or file
      description: The extension's name as `bromigos ext search` shows it, or the file in this repository.
      placeholder: hello-deck
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, one per line. Say if it happens every time.
      placeholder: |
        1. Run `bromigos ext install hello-deck`
        2. Run `bromigos-live plugin hello-deck`
        3. The deck stays black
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: Your machine
      description: Paste the output of `bromigos about text`. It gives the version, channel and hardware.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or a picture
      description: An error message, a log or a screenshot, if you have one.
      render: text
