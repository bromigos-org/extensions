# The bromigOS extension catalog (docs/extensions.md in bromigOS). `bromigos ext search`
# reads this file; the theme switcher shows its themes with their
# previews; `bromigos ext install <name>` installs an entry by name.
#
# Each [[extension]]: name (as its manifest says), description, kinds (what it
# provides), url (a git repository) and, when it isn't the repository's root, path (its
# folder in it); ref pins a tag or branch; preview is a picture in previews/ (or an
# https URL); tags help search. `bundled = true` marks what ships with bromigOS already
# (listed to be found, nothing to install). CI checks every entry (tools/check.py).
schema = 1

# ---------------------------------------------------------------- ship with bromigOS
[[extension]]
name = "mire"
display_name = "Mire"
description = "A night bayou: black mirror water, moss, fireflies and a lantern on a stilt shack."
kinds = ["theme"]
url = "https://github.com/bromigos-org/bromigOS"
path = "themes/mire"
preview = "previews/mire.png"
tags = ["world", "painted", "dark"]
bundled = true

[[extension]]
name = "tidewell"
display_name = "Tidewell"
description = "The sea at night, split at the waterline: Greywater Light above, the Choir below."
kinds = ["theme"]
url = "https://github.com/bromigos-org/bromigOS"
path = "themes/tidewell"
preview = "previews/tidewell.png"
tags = ["world", "painted", "dark"]
bundled = true

